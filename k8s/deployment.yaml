apiVersion: apps/v1
kind: Deployment

metadata:
  name: gestion-financiera

spec:

  # Puedes poner 1 para pruebas o 2-3 para demostrar escalabilidad
  replicas: 2

  selector:
    matchLabels:
      app: gestion-financiera

  template:
    metadata:
      labels:
        app: gestion-financiera

    spec:
      containers:

        - name: gestion-financiera

          # CAMBIAR si luego subes la imagen a Docker Hub
          image: gestion-financiera:1.0

          ports:
            - containerPort: 8080

          env:

            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: gestion-financiera-secrets
                  key: DB_URL

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gestion-financiera-secrets
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gestion-financiera-secrets
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gestion-financiera-secrets
                  key: JWT_SECRET